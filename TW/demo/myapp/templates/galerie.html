
{% load static %}
<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galerie</title>

  <link rel="stylesheet" href="{% static 'css/cursor.css' %}">
  <link rel="stylesheet" href="{% static 'css/galerie.css' %}">
</head>
<body>

  <!-- Container principal pentru carusel -->
  <div class="carousel-container">

    <!-- Container pentru imaginea mare -->
    <div class="carousel-view">
      <img id="carousel-image"
           src="{% static 'media/logo.jpg' %}"
           alt="Carusel">
    </div>

  </div>

  <!-- Scripturile JS compilate din TS -->
  <script src="{% static 'ts/cursor.js' %}" defer></script>
  <script src="{% static 'ts/galerie.js' %}" defer></script>

</body>
</html>
