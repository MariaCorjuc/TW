
{% load static %}
<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/login_style.css' %}">
</head>

<body>
    <div class="login-container">

        <div class="login-image">
            <img src="{% static 'media/logoLogin.jpg' %}" alt="Imagine login">
        </div>

        <div class="separator"></div>

        <div class="login-form">
            <h2>Autentificare</h2>

            <form id="loginForm">
                <input type="email" id="email" placeholder="Email">
                <input type="password" id="password" placeholder="Parola">
                <button type="submit">Login</button>
            </form>

            <button type="button">Conectare</button>

            <p class="register-text">
                Nu ai cont? <a href="{% url 'register' %}">Înregistrează-te</a>
            </p>
        </div>

    </div>

    <script src="{% static 'js/login_js.js' %}"></script>

</body>
</html>
